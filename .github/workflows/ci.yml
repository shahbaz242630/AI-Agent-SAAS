# CI — runs on every PR and push to main (BRD 9.10).
# Security gates per docs/SECURITY-TESTING-STRATEGY.md Section 4: every PR runs
# the verify gate plus secrets/dependency/workflow scans. CodeQL (default
# setup) and secret scanning + push protection are enabled at repo level.
# All actions are pinned to full commit SHAs; GITHUB_TOKEN is read-only.
name: CI

on:
  # ⚠️ `ready_for_review` IS LISTED BECAUSE IT IS NOT A DEFAULT, AND THE GAP IS
  # REAL. Without `types`, GitHub uses [opened, synchronize, reopened]. Draft
  # PR #89 opened with no CI run at all, and taking a draft out of draft fires
  # only `ready_for_review` — so a draft could be marked ready and merged having
  # never run the verify gate. Listing the defaults explicitly alongside it is
  # required: naming any type replaces the default set rather than adding to it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Test Postgres for @eva/database migration/seed/integration specs (BRD 13).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eva
          POSTGRES_PASSWORD: eva
          POSTGRES_DB: eva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eva"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version is read from package.json packageManager — keep in sync there.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (packages first, topological order)
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      # The platform/product walls (BRD §3.1.2, AGENTS.md A1-A7). A product
      # importing another product, or the platform importing a product, fails
      # here. Without this step the split is a naming convention that lasts
      # exactly as long as somebody remembers it.
      - name: Architecture boundaries
        run: pnpm run boundaries

      - name: Typecheck
        run: pnpm run typecheck

      - name: Create test database
        run: PGPASSWORD=eva psql -h localhost -U eva -d postgres -c "CREATE DATABASE eva_test;"

      # Applies migrations (incl. the eva_app RLS role) to the test database
      # before any spec runs — the API specs boot against it as eva_app.
      - name: Apply database migrations to test database
        run: pnpm --filter @eva/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eva:eva@localhost:5432/eva_test

      - name: Unit tests
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://eva:eva@localhost:5432/eva_test
          APP_DATABASE_URL: postgresql://eva_app:eva_app@localhost:5432/eva_test
          # API tests sign tokens locally and mock JWKS — no real Supabase.
          SUPABASE_URL: https://test.supabase.local

      - name: Format check
        run: pnpm run format:check

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor SARIF upload (fails on push-to-main without it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version is read from package.json packageManager — keep in sync there.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Dependency vulnerability audit (fails on high/critical)
        run: pnpm audit --audit-level=high

      - name: Workflow security lint (zizmor)
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks PRs that INTRODUCE high/critical vulnerable dependencies.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
